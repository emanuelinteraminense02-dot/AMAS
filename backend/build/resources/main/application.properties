# ============================================================
# AMAS - Configuração principal
# ============================================================

spring.application.name=amas

# ============================================================
# BANCO DE DADOS
# Local: MySQL
# Render: PostgreSQL/Supabase
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/amas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:amas_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# SERVIDOR
# ============================================================

server.port=${PORT:8080}

# ============================================================
# UPLOAD
# ============================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# JSON
# ============================================================

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================================================
# LOG
# ============================================================

logging.level.com.br.amas=INFO
logging.level.org.hibernate.SQL=DEBUG