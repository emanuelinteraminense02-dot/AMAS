# ============================================================
#  AMAS - application.properties
#  Sistema de Gestao da Associacao de Moradores e Amigos
# ============================================================

spring.application.name=amas

# ── Banco de Dados Principal: MySQL (Docker) ───────────────
spring.datasource.url=jdbc:mysql://localhost:3306/amas_db
spring.datasource.username=amas_user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Evita LazyInitializationException em endpoints simples
spring.jpa.open-in-view=false

# ── Servidor ─────────────────────────────────────────────────
server.port=8080

# ── Upload de arquivos ────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Serialização JSON ─────────────────────────────────────────
# Nao serializa campos nulos para respostas mais limpas
spring.jackson.default-property-inclusion=non_null
# Formato de data/hora padrao ISO-8601
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Logging ───────────────────────────────────────────────────
logging.level.com.br.amas=INFO
logging.level.org.hibernate.SQL=DEBUG

